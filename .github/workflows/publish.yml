name: Publish to npm (with provenance)

# Publishes the package to npm with an npm provenance attestation whenever a
# version tag (e.g. 0.1.1) is pushed. Provenance is required for n8n verified
# community node submissions.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC attestation)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
